branches:
  - main
tagFormat: "claude-code-review-v${version}"
plugins:
  - - '@semantic-release/commit-analyzer'
    - releaseRules:
        - breaking: true
          release: major
        - type: feat
          release: minor
        - type: fix
          release: patch
        - type: perf
          release: patch
        - type: chore
          scope: deps
          release: patch
        - release: patch
  - '@semantic-release/release-notes-generator'
  - - '@semantic-release/github'
    - successComment: false
      failComment: false
