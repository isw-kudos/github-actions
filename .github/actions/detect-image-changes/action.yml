name: Detect image changes
description: >-
  Change detection for a consolidated image-build workflow: fetch the
  push-diff base, run dorny/paths-filter over caller-supplied filters (or
  filters derived from each Dockerfile and the pnpm workspace graph), and
  assemble a build-matrix include-array from the filter results (or from a
  workflow_dispatch image list). The caller must check out the repository
  before this action runs — see README.md.

inputs:
  filters:
    description: >-
      paths-filter YAML. One filter per image key (matching the keys of
      `images`), plus any extra filters the caller wants surfaced in
      `changed_keys` (e.g. a smoke-relevant surface). Required unless
      `derive-filters` is "true" (workflow_dispatch, which never reads it,
      may leave it empty), and not allowed with it.
    required: false
    default: ""
  derive-filters:
    description: >-
      "true" derives each image's filter from its Dockerfile and the pnpm
      workspace graph instead of `filters`: the workspace dependency closure
      of every `turbo prune <targets> --docker` target, plus every
      build-context source the Dockerfile COPYs or ADDs. Needs a pnpm
      workspace whose package.json pins pnpm in `packageManager`; the action
      sets up Node.js and corepack itself. See README.md.
    required: false
    default: "false"
  shared-paths:
    description: >-
      With derive-filters: newline-separated paths every image depends on
      (lockfile, root config, this workflow, a submodule gitlink, workspace
      edges pnpm cannot see). They become a `shared` filter that every
      derived filter includes. `#` lines are comments.
    required: false
    default: ""
  aggregate-filters:
    description: >-
      With derive-filters: JSON object of extra filters, each the union of
      the image filters except `exclude`, plus `paths`. E.g.
      {"smoke": {"exclude": ["wikishift"], "paths": ["docker-compose.smoke.yaml"]}}.
      Their names surface in `changed_keys`.
    required: false
    default: ""
  scoped-lockfile:
    description: >-
      With derive-filters: the pnpm lockfile path (e.g. pnpm-lock.yaml) to
      scope per image instead of listing it in shared-paths. A change to it
      rebuilds only the images (and aggregate filters) whose slice of the
      lockfile differs from the base: their importers, the catalog entries
      they use, and the snapshots they reach. A base or lockfile that cannot
      be read rebuilds everything. See README.md.
    required: false
    default: ""
  images:
    description: >-
      JSON object mapping image key to {dockerfile_path, image, build_args?}.
      Key order is preserved in the matrix; a missing build_args becomes "".
    required: true
  dispatch-images:
    description: >-
      Comma-separated image keys to build on workflow_dispatch (pass the
      workflow's own `images` input through). Empty builds all. Any unknown
      key — even alongside valid ones — fails the run loudly: silently
      dropping it would give the operator a green run that skipped the image
      they asked for.
    required: false
    default: ""
  token:
    description: >-
      Token for the push-diff base fetch and paths-filter's PR file listing.
      Needs contents: read (and pull-requests: read on pull_request events).
    required: false
    default: ${{ github.token }}
  base:
    description: >-
      Branch to diff push events against. Default: the pushed branch on push
      events, empty otherwise — paths-filter's own default is the repo
      default branch, so a push to any other branch would diff against it
      (rebuilding everything ever changed there) via a credential-less fetch
      that fails; naming the pushed branch keeps every push diffing against
      event.before. Left empty on non-push events, where the input is
      ignored, so the action does not annotate every PR run with an
      ignored-input warning.
    required: false
    default: ""

outputs:
  matrix:
    description: >-
      Build-matrix include-array JSON: [{dockerfile_path, image, build_args},
      ...] for every selected image, in `images` key order.
    value: ${{ steps.matrix.outputs.matrix }}
  any_images:
    description: '"true" when the matrix is non-empty, "false" otherwise.'
    value: ${{ steps.matrix.outputs.any_images }}
  changed_keys:
    description: >-
      JSON array of every filter name that matched, including filters that
      are not image keys, plus every key a scoped-lockfile change affects. "[]" on workflow_dispatch or when a push has no
      reachable diff base (when the matrix instead selects by request or
      builds everything — see the matrix step).
    value: ${{ steps.matrix.outputs.changed_keys }}

runs:
  using: composite
  steps:
    # Composite actions do not enforce `required`, and an input the chosen
    # mode ignores would otherwise be dropped without a word. A missing
    # `filters` passes on workflow_dispatch, which never reads it: a v1.0.0
    # caller may compute it in a step that skips on dispatch.
    - name: Check inputs
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        DERIVE: ${{ inputs.derive-filters }}
        FILTERS: ${{ inputs.filters }}
        SHARED_PATHS: ${{ inputs.shared-paths }}
        AGGREGATE_FILTERS: ${{ inputs.aggregate-filters }}
        SCOPED_LOCKFILE: ${{ inputs.scoped-lockfile }}
      run: |
        set -euo pipefail
        fail() { echo "::error title=detect-image-changes::$1"; exit 1; }
        case "$DERIVE" in
          true)
            [ -z "$FILTERS" ] || fail "filters is not allowed with derive-filters: true"
            ;;
          false)
            [ -n "$FILTERS" ] || [ "$EVENT_NAME" = workflow_dispatch ] || fail "filters is required unless derive-filters is true"
            [ -z "$SHARED_PATHS$AGGREGATE_FILTERS$SCOPED_LOCKFILE" ] || fail "shared-paths, aggregate-filters and scoped-lockfile need derive-filters: true"
            ;;
          *) fail "derive-filters must be \"true\" or \"false\"" ;;
        esac

    # paths-filter diffs push events against the push's before-commit, which
    # is outside the caller's depth-1 clone; its own fetch fails when the
    # checkout persisted no credential, so fetch it here with a one-process
    # GIT_CONFIG_* credential (the token never lands in a command line or on
    # disk). Depth 1 suffices: a tree diff needs no history connectivity.
    # When there is no base to diff against -- the all-zero before of a
    # branch-creation push, or a before-commit the remote no longer has
    # (force-pushed history) -- the matrix step below falls back to building
    # everything instead of failing the push run: an over-build is
    # recoverable, a red run that built nothing is not.
    - name: Fetch push-diff base
      id: base
      if: github.event_name == 'push'
      shell: bash
      env:
        BEFORE_SHA: ${{ github.event.before }}
        GIT_TOKEN: ${{ inputs.token }}
      # the cat-file guard is if-form, not an &&-list: under bash -e a
      # failing &&-list left operand would abort the step instead of fetching
      run: |
        available=true
        if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
          available=false
        # already local (e.g. a deeper checkout): nothing to fetch
        elif ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
          auth=$(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 -w0)
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch --depth=1 --no-tags origin "$BEFORE_SHA" || available=false
        fi
        echo "available=${available}" >> "$GITHUB_OUTPUT"

    # The derive steps run only when paths-filter below will, so a registry
    # or corepack outage cannot block a manual rebuild. pnpm (pinned by the
    # caller's packageManager, via corepack) reads the workspace graph from
    # the package.json files alone: no install is needed.
    - name: Set up Node.js
      if: inputs.derive-filters == 'true' && github.event_name != 'workflow_dispatch' && steps.base.outputs.available != 'false'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"

    - name: Enable corepack
      if: inputs.derive-filters == 'true' && github.event_name != 'workflow_dispatch' && steps.base.outputs.available != 'false'
      shell: bash
      run: corepack enable

    - name: Derive per-image path filters
      id: derive
      if: inputs.derive-filters == 'true' && github.event_name != 'workflow_dispatch' && steps.base.outputs.available != 'false'
      shell: bash
      env:
        IMAGES_JSON: ${{ inputs.images }}
        SHARED_PATHS: ${{ inputs.shared-paths }}
        AGGREGATE_FILTERS: ${{ inputs.aggregate-filters }}
        LOCKFILE: ${{ inputs.scoped-lockfile }}
      run: node "$GITHUB_ACTION_PATH/derive-filters.cjs"

    # workflow_dispatch has no diff to filter; the matrix step selects by the
    # dispatch-images input instead (empty = all). Skipped too when a push
    # has no reachable diff base (see the step above) -- its own fetch would
    # hit the same wall, and the matrix step builds everything.
    - name: Detect changed paths
      id: filter
      if: github.event_name != 'workflow_dispatch' && steps.base.outputs.available != 'false'
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        token: ${{ inputs.token }}
        base: ${{ inputs.base != '' && inputs.base || (github.event_name == 'push' && github.ref_name || '') }}
        filters: ${{ inputs.derive-filters == 'true' && steps.derive.outputs.filters || inputs.filters }}

    # The base lockfile is the push's before-commit (fetched above) or the
    # PR's base commit, fetched the same way. When it cannot be fetched, or
    # has no lockfile, lockfile-scope.cjs counts every image as affected.
    - name: Scope lockfile change
      id: lockfile
      if: inputs.scoped-lockfile != '' && steps.filter.outputs.lockfile == 'true'
      shell: bash
      env:
        # on push, only when paths-filter also diffed against event.before:
        # with another `base`, an empty BASE_SHA affects every image
        BASE_SHA: ${{ github.event_name == 'push' && ((inputs.base == '' || inputs.base == github.ref_name) && github.event.before || '') || github.event.pull_request.base.sha }}
        GIT_TOKEN: ${{ inputs.token }}
        HEAD_LOCKFILE: ${{ inputs.scoped-lockfile }}
        LOCKFILE_ROOTS: ${{ steps.derive.outputs.roots }}
      run: |
        set -euo pipefail
        export BASE_LOCKFILE="$RUNNER_TEMP/base-lockfile"
        rm -f "$BASE_LOCKFILE"
        if [ -n "$BASE_SHA" ]; then
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            auth=$(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 -w0)
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
              git fetch --depth=1 --no-tags origin "$BASE_SHA" || true
          fi
          git show "${BASE_SHA}:${HEAD_LOCKFILE}" > "$BASE_LOCKFILE" 2>/dev/null || rm -f "$BASE_LOCKFILE"
        fi
        node "$GITHUB_ACTION_PATH/lockfile-scope.cjs"

    # The matrix is the set of images whose filter matched, or whose slice
    # of a scoped lockfile changed; on
    # workflow_dispatch (whose skipped filter step leaves changes empty) it
    # is instead the images named in the dispatch-images input, or all of
    # them when the input is empty -- an unknown key fails the run loudly,
    # so a typo'd dispatch cannot produce a green run that rebuilt nothing.
    - name: Compute build matrix
      id: matrix
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        IMAGES_JSON: ${{ inputs.images }}
        DISPATCH_IMAGES: ${{ inputs.dispatch-images }}
        BASE_AVAILABLE: ${{ steps.base.outputs.available }}
        FILTER_KEYS: ${{ steps.filter.outputs.changes }}
        LOCKFILE_KEYS: ${{ steps.lockfile.outputs.affected }}
      run: |
        set -euo pipefail
        CHANGED_KEYS=""
        if [ -n "$FILTER_KEYS" ]; then
          CHANGED_KEYS=$(jq -cn '
            (env.FILTER_KEYS | fromjson) as $filter
            | (env.LOCKFILE_KEYS | if . == "" then "[]" else . end | fromjson) as $lockfile
            | $filter + ($lockfile - $filter)')
        fi
        export CHANGED_KEYS
        matrix=$(jq -cn '
          (env.DISPATCH_IMAGES | split(",") | map(gsub("\\s"; "")) | map(select(. != ""))) as $requested
          | (env.CHANGED_KEYS | if . == null or . == "" then "[]" else . end | fromjson) as $changed
          | (env.IMAGES_JSON | fromjson | to_entries
             | map({key: .key, dockerfile_path: .value.dockerfile_path, image: .value.image, build_args: (.value.build_args // "")})) as $images
          # any unknown requested key -- even alongside valid ones -- must
          # fail loudly, not silently build the subset that parsed
          | ($requested - ($images | map(.key))) as $unknown
          | if ($unknown | length) > 0
            then error("unknown image key(s): " + ($unknown | join(", ")))
            else $images end
          | map(select(
              if env.EVENT_NAME == "workflow_dispatch"
              then ($requested == [] or (.key | IN($requested[])))
              elif env.EVENT_NAME == "push" and env.BASE_AVAILABLE == "false"
              # no diff base to filter against (see the fetch step): build
              # everything rather than fail or skip the push
              then true
              else (.key | IN($changed[]))
              end))
          | map(del(.key))
        ')
        echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
        echo "any_images=$(jq -c 'length > 0' <<<"$matrix")" >> "$GITHUB_OUTPUT"
        echo "changed_keys=${CHANGED_KEYS:-[]}" >> "$GITHUB_OUTPUT"
