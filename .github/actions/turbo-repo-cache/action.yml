name: Setup Turborepo Remote Cache (GCS)
description: >-
  Authenticate to Google Cloud via OIDC workload identity federation and
  start a local Turborepo remote-cache server backed by a Google Cloud
  Storage bucket. Subsequent `turbo` invocations in the job will read and
  write cache entries through the local server, which is stopped when the
  job ends.

# Prerequisites for the calling job: `id-token: write` permission, npm on
# PATH (the server package is installed at runtime), and a runner >= 2.336.0
# (the `$/` self-repository reference below). See README.md.

inputs:
  workload-identity-provider:
    description: >-
      Full resource name of the GCP workload identity provider, e.g.
      projects/123/locations/global/workloadIdentityPools/POOL/providers/PROVIDER.
    required: true
  service-account:
    description: GCP service account email to impersonate via WIF.
    required: true
  storage-path:
    description: GCS bucket name backing the Turborepo remote cache.
    required: true
  storage-provider:
    description: >-
      Storage backend understood by turborepo-remote-cache (s3,
      google-cloud-storage, azure-blob-storage). Defaults to
      google-cloud-storage, the only one the auth step above provides
      credentials for.
    required: false
    default: google-cloud-storage
  team-id:
    description: >-
      Exported as TURBO_TEAM; namespaces cache entries within the bucket.
    required: false
    default: ci

runs:
  using: composite
  steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ inputs.service-account }}

    - name: Start Turborepo remote cache server
      uses: $/.github/actions/turbo-repo-cache/server # self-repository ref: the server action at the exact commit this action runs from
      with:
        storage-provider: ${{ inputs.storage-provider }}
        storage-path: ${{ inputs.storage-path }}
        team-id: ${{ inputs.team-id }}
