name: Move branch tag forward
description: >-
  Point a branch tag (`main`, `dev`) on ghcr.io at a just-pushed image only
  when that keeps the tag on the newest commit of the branch, so builds of one
  image for consecutive commits can finish in any order. Part of the
  docker-build-ghcr component; called by docker-build-ghcr.yml when
  `forward_only_branch_tag` is on.

# Logic is implemented in Node (index.cjs, zero npm dependencies); see
# README.md. The decision and the move loop take their registry and GitHub
# access as arguments, so index.test.cjs tests them with plain node.

inputs:
  branch-tag:
    description: >-
      Full image reference of the branch tag to move, e.g.
      ghcr.io/<owner>/<image>:main.
    required: true
  digest:
    description: Digest of the image this build pushed (sha256:...).
    required: true
  settle-seconds:
    description: >-
      Seconds to wait after each move before reading the tag again. Must be
      longer than an older build's check-to-write time (normally 1-3 s).
    required: false
    default: "20"
  max-moves:
    description: Moves after which a tag that is still older fails the step.
    required: false
    default: "3"
  github-token:
    description: >-
      Token for the branch-ref and compare API calls on the calling
      repository; needs `contents: read`.
    required: false
    default: ${{ github.token }}

runs:
  using: node24
  main: index.cjs
