name: ECS Deploy

on:
  workflow_call:
    inputs:
      cluster_name:
        description: The name of the ECS cluster where the service is deployed
        type: string
      container_name:
        description: The name of the container to update in the task definition
        type: string
      environment:
        required: true
        type: string
      image_digest:
        required: true
        type: string
      message:
        required: false
        type: string
      service_name:
        description: The name of the ECS service where the task definition is deployed
        type: string
      ssm_parameter_name:
        description: The SSM parameter where the image digest is stored
        type: string

permissions: {}

jobs:
  update_service:
    name: Update Service
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read # checkout of the actions repo (via app token)
      id-token: write # OIDC federation for aws-actions/configure-aws-credentials
    steps:
      - name: Generate App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.DEVOPS_ISW_APP_ID }}
          private-key: ${{ secrets.DEVOPS_ISW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: github-actions
          permission-contents: read

      - name: Checkout Actions Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: actions
          ref: main
          repository: ${{ github.repository_owner }}/github-actions
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Save Current Image Digest in case of Failure
        id: save-digest
        env:
          SSM_PARAMETER_NAME: ${{ inputs.ssm_parameter_name != null && inputs.ssm_parameter_name || vars.SSM_PARAMETER_NAME }}
        run: |
          current_digest=$(aws ssm get-parameter \
            --name "$SSM_PARAMETER_NAME" \
            --query "Parameter.Value" \
            --output text)

          aws ssm put-parameter \
            --name "${SSM_PARAMETER_NAME}_last_known_working" \
            --type "String" \
            --value "$current_digest" \
            --overwrite

      - name: Push Image Digest to SSM
        env:
          SSM_PARAMETER_NAME: ${{ inputs.ssm_parameter_name != null && inputs.ssm_parameter_name || vars.SSM_PARAMETER_NAME }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          aws ssm put-parameter \
            --name "$SSM_PARAMETER_NAME" \
            --type "String" \
            --value "$IMAGE_DIGEST" \
            --overwrite

      - name: Download Current Task definition
        env:
          SERVICE_NAME: ${{ inputs.service_name != null && inputs.service_name || vars.SERVICE_NAME }}
        run: |
          aws ecs describe-task-definition \
          --task-definition "$SERVICE_NAME" \
          --query taskDefinition > task-definition.json

      - name: Update Image Digest in Task Definition
        id: task_def
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1.9.0
        with:
          task-definition: task-definition.json
          container-name: ${{ inputs.container_name != null && inputs.container_name || vars.CONTAINER_NAME }}
          image: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}@${{ inputs.image_digest }}

      - name: Deploy Updated Task Definition
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.task_def.outputs.task-definition }}
          service: ${{ inputs.service_name != null && inputs.service_name || vars.SERVICE_NAME }}
          cluster: ${{ inputs.cluster_name != null && inputs.cluster_name || vars.CLUSTER_NAME }}
          wait-for-service-stability: true
          propagate-tags: SERVICE
          wait-for-minutes: 20

      - name: Check Deployment Status
        id: check-deployment
        uses: ./actions/.github/actions/ecs-query # zizmor: ignore[self-repository] intentional: resolved from the app-token checkout of the mirror at ref:main (see "Checkout Actions Repo" above); a $/ self-repository ref would change the version+auth contract for cross-org consumers, so it is deferred to a dedicated PR
        with:
          query-type: check-deployment
          service: ${{ inputs.service_name != null && inputs.service_name || vars.SERVICE_NAME }}
          cluster: ${{ inputs.cluster_name != null && inputs.cluster_name || vars.CLUSTER_NAME }}
          target-task-definition: ${{ steps.deploy.outputs.task-definition-arn }}
          expected-status: 'COMPLETED'
          output-format: json

      - name: Validate Deployment Success
        id: validate-deployment
        env:
          SUCCESS: ${{ steps.check-deployment.outputs.success }}
          ROLLOUT_STATE: ${{ steps.check-deployment.outputs.rollout-state }}
        run: |
          echo "Deployment Status:"
          echo "  Success: $SUCCESS"
          echo "  Rollout State: $ROLLOUT_STATE"

          if [ "$SUCCESS" != "true" ]; then
            echo "❌ Deployment failed or rolled back: $ROLLOUT_STATE"
            exit 1
          fi

          echo "✅ Deployment completed successfully"

      - name: Push Last Working Image Digest to SSM (in case of failure)
        if: >-
          always() &&
          steps.save-digest.outcome == 'success' &&
          (
            steps.deploy.outcome == 'failure' ||
            steps.check-deployment.outcome == 'failure' ||
            steps.validate-deployment.outcome == 'failure'
          )
        env:
          SSM_PARAMETER_NAME: ${{ inputs.ssm_parameter_name != null && inputs.ssm_parameter_name || vars.SSM_PARAMETER_NAME }}
        run: |
          last_known_working=$(aws ssm get-parameter \
            --name "${SSM_PARAMETER_NAME}_last_known_working" \
            --query "Parameter.Value" \
            --output text)

          aws ssm put-parameter \
            --name "$SSM_PARAMETER_NAME" \
            --type "String" \
            --value "$last_known_working" \
            --overwrite

          echo "⚠️ Restored SSM parameter to last known working digest: $last_known_working"
