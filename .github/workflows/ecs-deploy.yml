name: ECS Deploy

on:
  workflow_call:
    inputs:
      cluster_name:
        description: The name of the ECS cluster where the service is deployed
        type: string
      container_name:
        description: The name of the container to update in the task definition
        type: string
      tag:
        required: true
        type: string
      environment:
        required: true
        type: string
      message:
        required: false
        type: string
      service_name:
        description: The name of the ECS service where the task definition is deployed
        type: string
      ssm_parameter_name:
        description: The SSM parameter where the image digest is stored
        type: string

jobs:
  determine_image_digest:
    name: Get Image Digest
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    if: ${{ inputs.tag == null || startsWith(inputs.tag, 'sha256') == false }}
    outputs:
      image_digest: ${{ steps.resolve_digest.outputs.digest }}
    steps:
      - name: Determine Tag Name
        id: get_tag
        if: ${{ inputs.tag == null }}
        run: |
          # If branch is main, use 'latest' tag, otherwise use branch name
          if [ "${{ github.ref_name }}" = "main" ]; then
            TAG="latest"
          else
            TAG=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Determined tag: $TAG"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Login to ECR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ECR_REGISTRY }}

      - name: Resolve Image Digest
        id: resolve_digest
        run: |
          # Attempt to find the most recent image digest for the branch
          REPOSITORY_NAME="${{ vars.ECR_REPOSITORY }}"

          # Fetch the most recent image digest for the branch
          DIGEST=$(aws ecr describe-images \
            --repository-name "$REPOSITORY_NAME" \
            --query "imageDetails[?imageTags[?contains(@,\`${{ steps.get_tag.outputs.tag || inputs.tag }}\`)]].[imageDigest]" \
            --output text)

          # Check if a valid digest was found
          if [[ "$DIGEST" =~ sha256 ]]; then
            echo "digest=$DIGEST" >> $GITHUB_OUTPUT
            echo "Using digest: '$DIGEST'"
          else
            echo "::error::No image found for tag ${{ steps.get_tag.outputs.tag || inputs.tag }}"
            exit 1
          fi

  update_service:
    name: Update Service
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    if: >-
      always() && (needs.determine_image_digest.result == 'success' || needs.determine_image_digest.result == 'skipped')
    needs:
      - determine_image_digest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Save Current Image Digest in case of Failure
        run: |
          current_digest=$(aws ssm get-parameter --name "${{ inputs.ssm_parameter_name != null && inputs.ssm_parameter_name || vars.SSM_PARAMETER_NAME }}" --query "Parameter.Value" --output text)
          aws ssm put-parameter \
            --name "${{ inputs.ssm_parameter_name != null && inputs.ssm_parameter_name || vars.SSM_PARAMETER_NAME }}_last_known_working" \
            --type "String" \
            --value "$current_digest" \
            --overwrite

      - name: Push Image Digest to SSM
        run: |
          aws ssm put-parameter \
            --name "${{ inputs.ssm_parameter_name != null && inputs.ssm_parameter_name || vars.SSM_PARAMETER_NAME }}" \
            --type "String" \
            --value "${{ startsWith(inputs.tag, 'sha256') && inputs.tag || needs.determine_image_digest.outputs.image_digest }}" \
            --overwrite

      - name: Download Current Task definition
        run: |
          aws ecs describe-task-definition \
          --task-definition ${{ inputs.service_name != null && inputs.service_name || vars.SERVICE_NAME }} \
          --query taskDefinition > task-definition.json

      - name: Update Image Digest in Task Definition
        id: task_def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ inputs.container_name != null && inputs.container_name || vars.CONTAINER_NAME }}
          image: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}@${{ startsWith(inputs.tag, 'sha256') && inputs.tag || needs.determine_image_digest.outputs.image_digest }}

      - name: Deploy Updated Task Definition
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task_def.outputs.task-definition }}
          service: ${{ inputs.service_name != null && inputs.service_name || vars.SERVICE_NAME }}
          cluster: ${{ inputs.cluster_name != null && inputs.cluster_name || vars.CLUSTER_NAME }}
          wait-for-service-stability: true
          propagate-tags: SERVICE
          wait-for-minutes: 20

      - name: Check if deployment was successful
        id: check-deployment
        run: |
          CURRENT_TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster ${{ inputs.cluster_name != null && inputs.cluster_name || vars.CLUSTER_NAME }} \
            --services ${{ inputs.service_name != null && inputs.service_name || vars.SERVICE_NAME }} \
            --query services[0].taskDefinition | jq -r ".")
          NEW_TASK_DEF_ARN=${{ steps.deploy.outputs.task-definition-arn }}
          printf "%-20s %s\n" "Current task arn:" "$CURRENT_TASK_DEF_ARN"
          printf "%-20s %s\n" "New task arn:" "$NEW_TASK_DEF_ARN"
          if [ "$CURRENT_TASK_DEF_ARN" != "$NEW_TASK_DEF_ARN" ]; then
            echo "::error::❌ DEPLOYMENT FAILED"
            echo "::error::The service is NOT running the task definition you just deployed."
            echo "::error::This possibly means ECS circuit breaker detected a problem and reverted to the previous version."
            echo "::error::"
            echo "::error::Common causes:"
            echo "::error::  - Container failed to start or crashed immediately"
            echo "::error::  - Health check failures"
            echo "::error::  - Port binding issues"
            echo "::error::  - Missing environment variables or secrets"
            echo "::error::"
            echo "::error::Check ECS console and CloudWatch logs for details."
            exit 1
          fi

      - name: Push Last Working Image Digest to SSM (in case of failure)
        if: steps.deploy.outcome == 'failure'
        run: |
          last_known_working=$(aws ssm get-parameter --name "${{ inputs.ssm_parameter_name != null && inputs.ssm_parameter_name || vars.SSM_PARAMETER_NAME }}_last_known_working" --query "Parameter.Value" --output text)
          aws ssm put-parameter \
            --name "${{ inputs.ssm_parameter_name != null && inputs.ssm_parameter_name || vars.SSM_PARAMETER_NAME }}" \
            --type "String" \
            --value "$last_known_working" \
            --overwrite
