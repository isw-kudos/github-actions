name: ECS Deploy

on:
  workflow_call:
    inputs:
      cluster_name:
        description: The name of the ECS cluster where the service is deployed
        type: string
      container_name:
        description: The name of the container to update in the task definition
        type: string
      environment:
        required: true
        type: string
      image_digest:
        required: true
        type: string
      message:
        required: false
        type: string
      service_name:
        description: The name of the ECS service where the task definition is deployed
        type: string
      ssm_parameter_name:
        description: The SSM parameter where the image digest is stored
        type: string

jobs:
  update_service:
    name: Update Service
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Generate App Token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: app-token
        with:
          client-id: ${{ vars.DEVOPS_ISW_APP_ID }}
          private-key: ${{ secrets.DEVOPS_ISW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: github-actions

      - name: Checkout Actions Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: actions
          ref: main
          repository: ${{ github.repository_owner }}/github-actions
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Save Current Image Digest in case of Failure
        id: save-digest
        run: |
          current_digest=$(aws ssm get-parameter \
            --name "${{ inputs.ssm_parameter_name != null && inputs.ssm_parameter_name || vars.SSM_PARAMETER_NAME }}" \
            --query "Parameter.Value" \
            --output text)

          aws ssm put-parameter \
            --name "${{ inputs.ssm_parameter_name != null && inputs.ssm_parameter_name || vars.SSM_PARAMETER_NAME }}_last_known_working" \
            --type "String" \
            --value "$current_digest" \
            --overwrite

      - name: Push Image Digest to SSM
        run: |
          aws ssm put-parameter \
            --name "${{ inputs.ssm_parameter_name != null && inputs.ssm_parameter_name || vars.SSM_PARAMETER_NAME }}" \
            --type "String" \
            --value "${{ inputs.image_digest }}" \
            --overwrite

      - name: Download Current Task definition
        run: |
          aws ecs describe-task-definition \
          --task-definition ${{ inputs.service_name != null && inputs.service_name || vars.SERVICE_NAME }} \
          --query taskDefinition > task-definition.json

      - name: Update Image Digest in Task Definition
        id: task_def
        uses: aws-actions/amazon-ecs-render-task-definition@77954e213ba1f9f9cb016b86a1d4f6fcdea0d57e # v1.8.4
        with:
          task-definition: task-definition.json
          container-name: ${{ inputs.container_name != null && inputs.container_name || vars.CONTAINER_NAME }}
          image: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}@${{ inputs.image_digest }}

      - name: Deploy Updated Task Definition
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@fc8fc60f3a60ffd500fcb13b209c59d221ac8c8c # v2.6.1
        with:
          task-definition: ${{ steps.task_def.outputs.task-definition }}
          service: ${{ inputs.service_name != null && inputs.service_name || vars.SERVICE_NAME }}
          cluster: ${{ inputs.cluster_name != null && inputs.cluster_name || vars.CLUSTER_NAME }}
          wait-for-service-stability: true
          propagate-tags: SERVICE
          wait-for-minutes: 20

      - name: Check Deployment Status
        id: check-deployment
        uses: ./actions/.github/actions/ecs-query
        with:
          query-type: check-deployment
          service: ${{ inputs.service_name != null && inputs.service_name || vars.SERVICE_NAME }}
          cluster: ${{ inputs.cluster_name != null && inputs.cluster_name || vars.CLUSTER_NAME }}
          target-task-definition: ${{ steps.deploy.outputs.task-definition-arn }}
          expected-status: 'COMPLETED'
          output-format: json

      - name: Validate Deployment Success
        id: validate-deployment
        run: |
          SUCCESS="${{ steps.check-deployment.outputs.success }}"
          ROLLOUT_STATE="${{ steps.check-deployment.outputs.rollout-state }}"

          echo "Deployment Status:"
          echo "  Success: $SUCCESS"
          echo "  Rollout State: $ROLLOUT_STATE"

          if [ "$SUCCESS" != "true" ]; then
            echo "❌ Deployment failed or rolled back: $ROLLOUT_STATE"
            exit 1
          fi

          echo "✅ Deployment completed successfully"

      - name: Push Last Working Image Digest to SSM (in case of failure)
        if: >-
          always() &&
          steps.save-digest.outcome == 'success' &&
          (
            steps.deploy.outcome == 'failure' ||
            steps.check-deployment.outcome == 'failure' ||
            steps.validate-deployment.outcome == 'failure'
          )
        run: |
          last_known_working=$(aws ssm get-parameter \
            --name "${{ inputs.ssm_parameter_name != null && inputs.ssm_parameter_name || vars.SSM_PARAMETER_NAME }}_last_known_working" \
            --query "Parameter.Value" \
            --output text)

          aws ssm put-parameter \
            --name "${{ inputs.ssm_parameter_name != null && inputs.ssm_parameter_name || vars.SSM_PARAMETER_NAME }}" \
            --type "String" \
            --value "$last_known_working" \
            --overwrite

          echo "⚠️ Restored SSM parameter to last known working digest: $last_known_working"
