name: Docker Build & Push to ECR

on:
  workflow_call:
    inputs:
      aws_region:
        required: true
        type: string
      aws_role_arn:
        required: true
        type: string
      ecr_registry:
        required: true
        type: string
      ecr_repository:
        required: true
        type: string
      ecr_cache_repository:
        required: false
        type: string
      tag:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build_push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    env:
      TZ: Australia/Hobart
    outputs:
      digest: ${{ steps.build_and_push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        id: aws_auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ inputs.aws_role_arn }}

      - name: Login to ECR
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.ecr_registry }}

      - name: Build and Push Docker Image
        id: build_and_push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Only building for AMD64 for now
          # platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ inputs.ecr_registry }}/${{ inputs.ecr_repository }}:${{ github.sha }}
            ${{ inputs.ecr_registry }}/${{ inputs.ecr_repository }}:${{ inputs.tag }}
          cache-from: ${{ inputs.ecr_cache_repository && format('type=registry,ref={0}/{1}:latest', inputs.ecr_registry, inputs.ecr_cache_repository) || '' }}
          cache-to: ${{ inputs.ecr_cache_repository && format('type=registry,ref={0}/{1}:latest,mode=max,oci-mediatypes=true,image-manifest=true', inputs.ecr_registry, inputs.ecr_cache_repository) || '' }}
