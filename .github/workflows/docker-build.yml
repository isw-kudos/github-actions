name: Docker Build

on:
  workflow_call:
    inputs:
      architecture:
        default: linux/amd64
        description: The target CPU architecture to build the image for
        required: false
        type: string
      build_args:
        description: Build arguments to pass to docker build
        required: false
        type: string
      enable_caching:
        default: true
        description: Whether to enable the docker build cache
        required: false
        type: boolean
      provenance:
        default: true
        description: Whether to generate provenance for the image
        required: false
        type: boolean
      push:
        default: true
        description: Whether to push the image to a remote repository
        required: false
        type: boolean
    outputs:
      digest:
        description: The image digest
        value: ${{ jobs.build_push.outputs.digest }}

env:
  branch: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

jobs:
  build_push:
    name: Build & Push
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build_and_push.outputs.digest }}
    steps:
      - name: Configure AWS Credentials
        id: aws_auth
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Login to ECR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ vars.ECR_REGISTRY }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: |
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}
          tags: |
            type=raw,value=${{ env.branch }}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYY-MM-DD' tz='Australia/Sydney'}},enable={{is_default_branch}}

      - name: Build and Push Docker Image
        id: build_and_push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          build-args: ${{ inputs.build_args }}
          platforms: ${{ inputs.architecture }}
          provenance: ${{ inputs.provenance }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: ${{ inputs.enable_caching && format('type=registry,ref={0}/{1}:latest', vars.ECR_REGISTRY, vars.ECR_CACHE_REPOSITORY) }}
          cache-to: ${{ inputs.enable_caching && format('type=registry,ref={0}/{1}:latest,mode=max,oci-mediatypes=true,image-manifest=true', vars.ECR_REGISTRY, vars.ECR_CACHE_REPOSITORY) }}
