name: Docker Build

on:
  workflow_call:
    inputs:
      environment:
        description: The environment to use for secrets/variables
        type: string
        required: true
    outputs:
      digest:
        description: The image digest
        value: ${{ jobs.build_push.outputs.digest }}

env:
  branch: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

jobs:
  build_push:
    name: Build & Push
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build_and_push.outputs.digest }}
    steps:
      - name: Generate App Token
        uses: actions/create-github-app-token@v1
        id: app_token
        with:
          app-id: ${{ vars.DEVOPS_ISW_APP_ID }}
          private-key: ${{ secrets.DEVOPS_ISW_APP_PRIVATE_KEY }}
          owner: ISW-AISP
          repositories: github-actions

      - name: Checkout Custom Actions
        uses: actions/checkout@v4
        with:
          ref: main
          repository: ISW-AISP/github-actions
          token: ${{ steps.app_token.outputs.token }}
          path: actions

      - name: Set Environment Variables
        uses: ./actions/set-env-vars
        with:
          environment_prefix: ${{ inputs.environment }}
          secrets_context: ${{ toJson(secrets) }}
          vars_context: ${{ toJson(vars) }}

      - name: Configure AWS Credentials
        id: aws_auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}

      - name: Login to ECR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ECR_REGISTRY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=raw,value=${{ env.branch }}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYY-MM-DD' tz='Australia/Sydney'}},enable={{is_default_branch}}

      - name: Build and Push Docker Image
        id: build_and_push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_CACHE_REPOSITORY }}:latest
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_CACHE_REPOSITORY }}:latest,mode=max,oci-mediatypes=true,image-manifest=true
