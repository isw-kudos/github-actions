name: Docker Build

on:
  workflow_call:
    outputs:
      digest:
        description: The image digest
        value: ${{ jobs.build_push.outputs.digest }}

jobs:
  build_push:
    name: Build & Push
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build_and_push.outputs.digest }}
    steps:
      - name: Set tag name
        id: set_tag
        run: |
          # Determine branch name
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH_NAME="${{ github.head_ref }}"
          else
            BRANCH_NAME="${{ github.ref_name }}"
          fi

          # If branch is main, use 'latest' tag, otherwise use branch name
          if [ "$BRANCH_NAME" = "main" ]; then
            TAG="latest"
          else
            TAG=$(echo "$BRANCH_NAME" | sed 's/\//-/g')
          fi

          # Set tag output
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag is '$TAG'"

      - name: Generate App Token
        uses: actions/create-github-app-token@v1
        id: app_token
        with:
          app-id: ${{ vars.DEVOPS_ISW_APP_ID }}
          private-key: ${{ secrets.DEVOPS_ISW_APP_PRIVATE_KEY }}
          owner: ISW-AISP
          repositories: github-actions

      - name: Checkout Custom Actions
        uses: actions/checkout@v4
        with:
          ref: main
          repository: ISW-AISP/github-actions
          token: ${{ steps.app_token.outputs.token }}
          path: actions

      - name: Set Environment Variables
        uses: ./actions/set-env-vars
        with:
          environment_prefix: ${{ steps.set_env.outputs.environment }}
          secrets_context: ${{ toJson(secrets) }}
          vars_context: ${{ toJson(vars) }}

      - name: Configure AWS Credentials
        id: aws_auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}

      - name: Login to ECR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ECR_REGISTRY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        id: build_and_push
        uses: docker/build-push-action@v6
        with:
          # Only building for AMD64 for now
          # platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.set_tag.outputs.tag }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_CACHE_REPOSITORY }}:latest
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_CACHE_REPOSITORY }}:latest,mode=max,oci-mediatypes=true,image-manifest=true
