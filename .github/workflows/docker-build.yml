name: Docker Build

on:
  workflow_call:
    inputs:
      architecture:
        default: linux/amd64
        description: The target CPU architecture to build the image for
        required: false
        type: string
      build_args:
        description: Build arguments to pass to docker build
        required: false
        type: string
      enable_caching:
        default: true
        description: Whether to enable the docker build cache
        required: false
        type: boolean
      provenance:
        default: true
        description: Whether to generate provenance for the image
        required: false
        type: boolean
      push:
        default: true
        description: Whether to push the image to a remote repository
        required: false
        type: boolean
    outputs:
      digest:
        description: The image digest
        value: ${{ jobs.build_push.outputs.digest }}

env:
  branch: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

jobs:
  build_push:
    name: Build & Push
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build_and_push.outputs.digest }}
    steps:
      - name: Configure AWS Credentials
        id: aws_auth
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Login to ECR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.ECR_REGISTRY }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}
          tags: |
            type=raw,value=${{ env.branch }}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYY-MM-DD' tz='Australia/Sydney'}},enable={{is_default_branch}}

      - name: Build and Push Docker Image
        id: build_and_push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          build-args: ${{ inputs.build_args }}
          platforms: ${{ inputs.architecture }}
          provenance: ${{ inputs.provenance }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: ${{ inputs.enable_caching && format('type=registry,ref={0}/{1}:latest', vars.ECR_REGISTRY, vars.ECR_CACHE_REPOSITORY) }}
          cache-to: ${{ inputs.enable_caching && format('type=registry,ref={0}/{1}:latest,mode=max,oci-mediatypes=true,image-manifest=true', vars.ECR_REGISTRY, vars.ECR_CACHE_REPOSITORY) }}
