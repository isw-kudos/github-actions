name: Workflow Security (zizmor)

# Static security analysis of GitHub Actions workflows.
# advanced-security: false -> emits annotations and fails the job on findings,
# instead of SARIF upload (which needs GitHub Advanced Security on a private repo).

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout the repo
      actions: read # zizmor online audits read workflow/action metadata
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          # renovate: datasource=github-releases depName=zizmorcore/zizmor extractVersion=^v(?<version>.*)$
          version: 1.30.0 # pin the CLI; do not track "latest"
          advanced-security: false # annotations + fail CI; no GHAS/SARIF
          persona: regular
