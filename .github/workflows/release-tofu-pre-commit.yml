name: Release tofu-pre-commit

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tofu-pre-commit.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    permissions:
      contents: write # semantic-release pushes tags and creates GitHub Releases
      issues: write # semantic-release comments on released issues
      pull-requests: write # semantic-release comments on released PRs
    steps:
      - name: Generate App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.DEVOPS_ISW_APP_ID }}
          private-key: ${{ secrets.DEVOPS_ISW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Snapshot existing tags
        run: git tag -l 'tofu-pre-commit-v*' | sort > /tmp/tags_before.txt

      - name: Run semantic-release
        working-directory: releases/tofu-pre-commit
        run: npx --package semantic-release@25.0.3 semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Detect new release
        id: check
        run: |
          git fetch --tags
          git tag -l 'tofu-pre-commit-v*' | sort > /tmp/tags_after.txt
          NEW_TAG=$(comm -13 /tmp/tags_before.txt /tmp/tags_after.txt | head -1)
          if [[ -n "$NEW_TAG" ]]; then
            echo "released=true"  >> "$GITHUB_OUTPUT"
            echo "tag=$NEW_TAG"   >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
