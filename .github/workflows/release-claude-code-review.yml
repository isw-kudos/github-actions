name: Release claude-code-review

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/claude-code-review.yml'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.DEVOPS_ISW_APP_ID }}
          private-key: ${{ secrets.DEVOPS_ISW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Snapshot existing tags
        run: git tag -l 'claude-code-review-v*' | sort > /tmp/tags_before.txt

      - name: Run semantic-release
        working-directory: releases/claude-code-review
        run: npx --package semantic-release@25.0.3 semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Detect new release
        id: check
        run: |
          git fetch --tags
          git tag -l 'claude-code-review-v*' | sort > /tmp/tags_after.txt
          NEW_TAG=$(comm -13 /tmp/tags_before.txt /tmp/tags_after.txt | head -1)
          if [[ -n "$NEW_TAG" ]]; then
            echo "released=true"  >> "$GITHUB_OUTPUT"
            echo "tag=$NEW_TAG"   >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
