name: Sync Mirrors

on: push

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        org: [ISW-AISP, isw-kudos]
    steps:
      - name: Generate App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.DEVOPS_ISW_APP_ID }}
          private-key: ${{ secrets.DEVOPS_ISW_APP_PRIVATE_KEY }}
          owner: ${{ matrix.org }}
          repositories: github-actions

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Sync mirrors
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git clone https://${{ steps.app-token.outputs.app-slug }}:${{ steps.app-token.outputs.token }}@github.com/${{ matrix.org }}/github-actions.git
          cd github-actions
          git remote add source https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git fetch source
          git push origin 'refs/remotes/source/*:refs/heads/*' --force --prune
          git push origin --tags --force
