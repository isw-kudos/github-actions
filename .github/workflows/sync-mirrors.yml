name: Sync Mirrors

on: push

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.DEVOPS_ISW_APP_ID }}
          private-key: ${{ secrets.DEVOPS_ISW_APP_PRIVATE_KEY }}
          owner: ISW-AISP
          repositories: github-actions

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync mirrors
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git clone https://${{ steps.app-token.outputs.app-slug }}:${{ steps.app-token.outputs.token }}@github.com/ISW-AISP/github-actions.git
          cd github-actions
          git remote add source https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git fetch source
          git push origin 'refs/remotes/source/*:refs/heads/*' --force --prune
