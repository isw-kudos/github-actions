name: Sync Mirrors

on: push

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        org: [ISW-AISP, isw-kudos]
    steps:
      - name: Generate App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.DEVOPS_ISW_APP_ID }}
          private-key: ${{ secrets.DEVOPS_ISW_APP_PRIVATE_KEY }}
          owner: ${{ matrix.org }}
          repositories: github-actions
          permission-contents: write
          # The mirror push includes .github/workflows/** — without this,
          # GitHub rejects the push ("refusing to allow a GitHub App to
          # create or update workflow ... without workflows permission").
          permission-workflows: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync mirrors
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_TOKEN: ${{ github.token }}
          MIRROR_ORG: ${{ matrix.org }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git clone "https://${APP_SLUG}:${APP_TOKEN}@github.com/${MIRROR_ORG}/github-actions.git"
          cd github-actions
          git remote add source "https://x-access-token:${SOURCE_TOKEN}@github.com/${SOURCE_REPO}.git"
          git fetch source
          git push origin 'refs/remotes/source/*:refs/heads/*' --force --prune
          git push origin --tags --force
