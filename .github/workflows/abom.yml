name: ABOM Supply Chain Check

# Use pull_request_target so the workflow file is read from the base
# branch (main), preventing a PR from tampering with or disabling the
# supply chain check.
#
# SECURITY: This trigger runs with privileged context. To mitigate risk:
#   1. Checkout the PR HEAD explicitly (ref below) — we need to scan the
#      PR's workflow files, not main's.
#   2. abom only READS yaml files — it never executes code from the
#      checkout. Do NOT add run steps that execute PR-sourced scripts.
#   3. Permissions are minimised to contents:read + pull-requests:write.
#   4. No repository secrets are referenced.
#   5. All actions are SHA-pinned in this file (served from main, not PR).
#
# See: https://docs.github.com/en/actions/reference/security/secure-use#mitigating-the-risks-of-untrusted-code-checkout
on:
  pull_request_target:
    branches:
      - main
    paths:
      - '.github/workflows/**'

jobs:
  abom-scan:
    name: Verify Actions Supply Chain (ABOM)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      # Checkout the PR head — abom needs to scan the PR's workflow files.
      # SECURITY: Do NOT run any scripts or code from this checkout.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 'stable'

      - name: Install abom
        run: go install github.com/julietsecurity/abom@v0.2.1

      - name: Run ABOM supply chain scan
        id: abom
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          OUTPUT=$(abom scan . --check --verify-shas --github-token "$GITHUB_TOKEN" 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          {
            echo "output<<EOF"
            echo "$OUTPUT"
            echo "EOF"
            echo "exit_code=$EXIT_CODE"
          } >> "$GITHUB_OUTPUT"

      - name: Post scan results as PR comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: abom
          message: |
            ## ABOM Supply Chain Scan ${{ steps.abom.outputs.exit_code == '1' && '— COMPROMISED ACTIONS DETECTED' || '' }}

            <details>
            <summary>Full scan output</summary>

            ```
            ${{ steps.abom.outputs.output }}
            ```
            </details>

      - name: Fail if compromised actions detected
        if: steps.abom.outputs.exit_code == '1'
        run: |
          echo "::error::ABOM detected compromised actions in the supply chain"
          exit 1
