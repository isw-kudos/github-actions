name: ABOM Supply Chain Check

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/**'

jobs:
  abom-scan:
    name: Verify Actions Supply Chain (ABOM)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install abom
        env:
          ABOM_VERSION: "0.1.3"
        run: |
          curl -fsSLo abom_linux_amd64.tar.gz \
            "https://github.com/JulietSecurity/abom/releases/download/v${ABOM_VERSION}/abom_linux_amd64.tar.gz"
          curl -fsSLo checksums.txt \
            "https://github.com/JulietSecurity/abom/releases/download/v${ABOM_VERSION}/checksums.txt"
          grep "abom_linux_amd64.tar.gz" checksums.txt | sha256sum -c -
          tar -xzf abom_linux_amd64.tar.gz abom
          chmod +x abom
          sudo mv abom /usr/local/bin/abom

      - name: Run ABOM supply chain scan
        id: abom
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          OUTPUT=$(abom scan . 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          {
            echo "output<<EOF"
            echo "$OUTPUT"
            echo "EOF"
            echo "exit_code=$EXIT_CODE"
          } >> "$GITHUB_OUTPUT"

      - name: Post scan results as PR comment
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: abom
          message: |
            ## ABOM Supply Chain Scan

            > :information_source: Informational only — review the dependency tree below before merging.

            <details>
            <summary>Full scan output</summary>

            ```
            ${{ steps.abom.outputs.output }}
            ```
            </details>
