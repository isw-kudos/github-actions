name: Pre-Commit Checks

on:
  workflow_call:

jobs:
  pre-commit:
    name: Run pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          # renovate: datasource=github-tags depName=python/cpython extractVersion=^v(?<version>.*)$
          python-version: 3.14.5

      - name: Cache Go Modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          # renovate: datasource=github-tags depName=golang/go extractVersion=^go(?<version>.*)$
          go-version: 1.26.3

      - name: Setup Terraform Docs
        run: go install github.com/terraform-docs/terraform-docs@v0.24.0

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.71.0

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2.0.1
        with:
          # renovate: datasource=github-releases depName=opentofu/opentofu extractVersion=^v(?<version>.*)$
          tofu_version: 1.12.0
          tofu_wrapper: false

      - name: Run Pre-Commit Checks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
