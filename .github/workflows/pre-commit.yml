name: Pre-Commit Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - renovate/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Run Pre-commit Checks
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'renovate/') || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # --from-ref/--to-ref need the merge-base with main
          persist-credentials: false

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      # Hand-rolled instead of pre-commit/action: that wrapper pulls
      # actions/cache by tag, which the repo's SHA-pinning policy rejects.
      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          # Exact key only, no restore-keys: restoring a stale cache stacks old
          # hook envs beside the new ones and eventually fills the runner disk.
          key: pre-commit-3|${{ steps.setup-python.outputs.python-version }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run Pre-Commit Checks
        env:
          # pre-commit diffs from...to (merge-base), so the base tip is a safe
          # anchor for PRs. Renovate pushes anchor on main instead:
          # github.event.before is the null SHA when the branch is created and
          # unreachable after a force-pushed rebase.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pre-commit run \
            --show-diff-on-failure \
            --color=always \
            --from-ref "${PR_BASE_SHA:-origin/main}" \
            --to-ref "${PR_HEAD_SHA:-HEAD}"

      - name: Prune stale pre-commit environments
        if: always()
        run: pre-commit gc
