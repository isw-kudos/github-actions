name: Pre-Commit Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - renovate/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Run Pre-commit Checks
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'renovate/') || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

      # Hand-rolled instead of pre-commit/action: that wrapper pulls
      # actions/cache by tag, which the repo's SHA-pinning policy rejects.
      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Cache pre-commit hook environments
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run Pre-Commit Checks
        run: pre-commit run --show-diff-on-failure --color=always --all-files
