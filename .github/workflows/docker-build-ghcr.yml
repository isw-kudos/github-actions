name: Docker Build (GHCR)

on:
  workflow_call:
    inputs:
      architecture:
        default: linux/amd64
        description: The target CPU architecture to build the image for
        required: false
        type: string
      build_args:
        description: Build arguments to pass to docker build (one KEY=VALUE per line)
        required: false
        type: string
      context:
        default: .
        description: >-
          Docker build context path within the checked-out workspace.
          Must be a local path - remote/git contexts bypass .dockerignore.
        required: false
        type: string
      dockerfile_path:
        default: Dockerfile
        description: Path to the Dockerfile, relative to the repository root
        required: false
        type: string
      image:
        description: Image name; pushed as ghcr.io/<repository owner>/<image>
        required: true
        type: string
      tag:
        description: >-
          Deprecated. Tags are generated from the event (branch name, pr-N,
          sha-<commit>); a value here is pushed as one more tag so callers
          written for v1.0.0 keep working. New callers should not set it.
        required: false
        type: string
    secrets:
      HUDDO_DEVOPS_GITHUB_APP_PRIVATE_KEY:
        description: >-
          Private key of the GitHub App used to check out private submodules.
          Only needed when the calling repository has a .gitmodules file; the
          app client id is read from the caller's HUDDO_DEVOPS_GITHUB_APP_ID variable.
        required: false
    outputs:
      digest:
        description: The pushed image digest
        value: ${{ jobs.build.outputs.digest }}
      tags:
        description: The pushed image references, one ghcr.io/<owner>/<image>:<tag> per line
        value: ${{ jobs.build.outputs.tags }}

# Keyed by image so a caller workflow may build several images from one ref
# without the jobs cancelling each other (`github.workflow` is the caller's).
# Pull requests queue per ref and cancel the superseded build; every other
# event queues per commit, because GitHub keeps only one pending run per group
# and drops the older one, and a dropped push would leave that commit with no
# `sha-<commit>` tag (which is what a promote resolves).
concurrency:
  group: ${{ github.workflow }}-${{ inputs.image }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    # GitHub validates this grant against the caller's: a caller granting less
    # fails at startup with no logs, so every entry here is one every caller
    # must hold. Deliberately no `id-token: write` - nothing below requests an
    # OIDC token (no signing, no attestations, default buildx driver).
    permissions:
      contents: read # checkout the calling repo
      packages: write # push the image and build cache to ghcr.io
    outputs:
      digest: ${{ steps.build_push.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `secrets` is not available in step `if:`, so .gitmodules on disk is the
      # signal that a private submodule needs the app token. Its github.com URLs
      # under the calling owner (https, ssh, or `../name`) give the exact
      # repository list to scope that token to, plus the calling repo itself
      # because the second checkout re-fetches it with the same token. Names are
      # allowlisted before reaching $GITHUB_OUTPUT; the `|| :` guards keep an
      # empty match from failing the step under pipefail.
      - name: Detect submodules
        id: submodules
        shell: bash
        run: |
          if [ ! -s .gitmodules ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          owner="$GITHUB_REPOSITORY_OWNER"
          submodule_repos=$(
            { git config --file .gitmodules --get-regexp '^submodule\..*\.url$' || :; } | awk '{print $2}' |
            sed -E "s#^\.\./#$owner/#; s#^https?://github\.com/##; s#^git@github\.com:##; s#(\.git)?/?\$##" |
            awk -F/ -v owner="$owner" 'NF == 2 && tolower($1) == tolower(owner) { print $2 }' |
            { grep -E '^[A-Za-z0-9._-]+$' || :; } | sort -u | paste -sd, -
          )
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "repositories=${GITHUB_REPOSITORY#*/}${submodule_repos:+,$submodule_repos}" >> "$GITHUB_OUTPUT"

      - name: Generate App Token
        if: steps.submodules.outputs.exists == 'true'
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HUDDO_DEVOPS_GITHUB_APP_ID }}
          private-key: ${{ secrets.HUDDO_DEVOPS_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.submodules.outputs.repositories }}
          permission-contents: read

      - name: Checkout code (with submodules)
        if: steps.submodules.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ steps.app_token.outputs.token }}
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # binfmt is only needed to emulate a foreign platform; skipping it keeps
      # the default amd64 path free of an extra Docker Hub pull.
      - name: Set up QEMU
        if: inputs.architecture != 'linux/amd64'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # One tag set for every caller, derived from the event: the branch name
      # on a branch push (`main`, `dev`), `pr-N` on a pull request, the git tag
      # on a tag push, and always `sha-<full commit sha>` so a manifest can be
      # found by the commit that built it (collab and boards promote the
      # huddo-services images by that tag, from their submodule pin). No
      # `latest` and no date tag: nothing deploys either, and a date is not
      # unique per build while the `created` label already records it. On a
      # pull request the sha is the PR head, a commit that exists in the
      # repository, not the ephemeral refs/pull/N/merge commit.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_PR_HEAD_SHA: true
          # With provenance on (the build-push default) the tag points at an
          # OCI index, so put the annotations there too; that is what a
          # registry browser or `crane manifest <image>:<tag>` shows.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build & Push Docker Image
        id: build_push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # Build from the checked-out workspace, NOT the default Git context.
          # BuildKit does not apply the repo's .dockerignore when it clones the
          # Git context itself, so ignored files (e.g. dev fixtures) leak into
          # the build context and the published image.
          context: ${{ inputs.context }}
          push: true
          build-args: ${{ inputs.build_args }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}-buildcache:latest
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}-buildcache:latest,mode=max,oci-mediatypes=true,image-manifest=true
          file: ${{ inputs.dockerfile_path }}
          platforms: ${{ inputs.architecture }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
