name: Docker Build (GHCR)

on:
  workflow_call:
    inputs:
      architecture:
        default: linux/amd64
        description: The target CPU architecture to build the image for
        required: false
        type: string
      build_args:
        description: Build arguments to pass to docker build (one KEY=VALUE per line)
        required: false
        type: string
      cache:
        default: auto
        description: >-
          Layer-cache backend. `auto` picks by runner: Blacksmith's
          persistent sticky disk on a blacksmith-* runner, the ghcr.io
          registry cache otherwise. `registry` forces the ghcr.io registry
          cache on any runner. Sticky disks bill per GB-month around the
          clock, so callers with infrequent builds (e.g. label-gated ones)
          should pass `registry` even when building on Blacksmith runners.
        required: false
        type: string
      context:
        default: .
        description: >-
          Docker build context path within the checked-out workspace.
          Must be a local path - remote/git contexts bypass .dockerignore.
        required: false
        type: string
      forward_only_branch_tag:
        default: false
        description: >-
          On a branch build (push, workflow_dispatch, schedule), move the
          branch tag (`main`, `dev`) only to a newer commit. The image is
          pushed as `sha-<commit>` only; a later step points the branch tag
          at it unless the tag already holds this commit or a newer one. Two
          builds of one image for consecutive commits can then finish in any
          order without leaving the branch tag on the older commit.
        required: false
        type: boolean
      dockerfile_path:
        default: Dockerfile
        description: Path to the Dockerfile, relative to the repository root
        required: false
        type: string
      image:
        description: Image name; pushed as ghcr.io/<repository owner>/<image>
        required: true
        type: string
      runner:
        default: ubuntu-latest
        description: >-
          Runner label for the build job. A Blacksmith label (blacksmith-*)
          also builds with Blacksmith's persistent-disk layer cache by
          default; see `cache` to override that.
        required: false
        type: string
      tag:
        description: >-
          Deprecated. Tags are generated from the event (branch name, pr-N,
          sha-<commit>); a value here is pushed as one more tag so callers
          written for v1.0.0 keep working. New callers should not set it.
        required: false
        type: string
      target:
        description: >-
          Dockerfile stage to build (`docker build --target`), for a Dockerfile
          that produces more than one image; each image is a separate call
          with its own `image`. Empty builds the last stage.
        required: false
        type: string
    secrets:
      HUDDO_DEVOPS_GITHUB_APP_PRIVATE_KEY:
        description: >-
          Private key of the GitHub App used to check out private submodules.
          Only needed when the calling repository has a .gitmodules file; the
          app client id is read from the caller's HUDDO_DEVOPS_GITHUB_APP_ID variable.
        required: false
    outputs:
      digest:
        description: The pushed image digest
        value: ${{ jobs.build.outputs.digest }}
      tags:
        description: >-
          The pushed image references, one ghcr.io/<owner>/<image>:<tag> per
          line. With `forward_only_branch_tag`, the branch tag is not in the
          list: the build does not push it, and a later step moves it only
          when this commit is newer.
        value: ${{ jobs.build.outputs.tags }}

# Keyed by image so a caller workflow may build several images from one ref
# without the jobs cancelling each other (`github.workflow` is the caller's).
# Pull requests queue per ref and cancel the superseded build; every other
# event queues per commit, because GitHub keeps only one pending run per group
# and drops the older one, and a dropped push would leave that commit with no
# `sha-<commit>` tag (which is what a promote resolves).
concurrency:
  group: ${{ github.workflow }}-${{ inputs.image }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build:
    name: Build & Push
    runs-on: ${{ inputs.runner }}
    # GitHub validates this grant against the caller's: a caller granting less
    # fails at startup with no logs, so every entry here is one every caller
    # must hold. Deliberately no `id-token: write` - nothing below requests an
    # OIDC token on either build path (no signing, no attestations).
    permissions:
      contents: read # checkout the calling repo
      packages: write # push the image (and, on the buildx path, its build cache) to ghcr.io
    outputs:
      digest: ${{ steps.build_push.outputs.digest || steps.build_push_blacksmith.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `secrets` is not available in step `if:`, so .gitmodules on disk is the
      # signal that a private submodule needs the app token. Its github.com URLs
      # under the calling owner (https, ssh, or `../name`) give the exact
      # repository list to scope that token to, plus the calling repo itself
      # because the second checkout re-fetches it with the same token. Names are
      # allowlisted before reaching $GITHUB_OUTPUT; the `|| :` guards keep an
      # empty match from failing the step under pipefail.
      - name: Detect submodules
        id: submodules
        shell: bash
        run: |
          if [ ! -s .gitmodules ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          owner="$GITHUB_REPOSITORY_OWNER"
          submodule_repos=$(
            { git config --file .gitmodules --get-regexp '^submodule\..*\.url$' || :; } | awk '{print $2}' |
            sed -E "s#^\.\./#$owner/#; s#^https?://github\.com/##; s#^git@github\.com:##; s#(\.git)?/?\$##" |
            awk -F/ -v owner="$owner" 'NF == 2 && tolower($1) == tolower(owner) { print $2 }' |
            { grep -E '^[A-Za-z0-9._-]+$' || :; } | sort -u | paste -sd, -
          )
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "repositories=${GITHUB_REPOSITORY#*/}${submodule_repos:+,$submodule_repos}" >> "$GITHUB_OUTPUT"

      - name: Generate App Token
        if: steps.submodules.outputs.exists == 'true'
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HUDDO_DEVOPS_GITHUB_APP_ID }}
          private-key: ${{ secrets.HUDDO_DEVOPS_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.submodules.outputs.repositories }}
          permission-contents: read

      - name: Checkout code (with submodules)
        if: steps.submodules.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ steps.app_token.outputs.token }}
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fail fast on a cache input typo: the builder-setup and build steps
      # below select on `cache`, and an unrecognised value would otherwise
      # silently behave as `auto` -- for a caller trying to opt out of sticky
      # disks, that silence is exactly the expensive bug being avoided.
      - name: Validate cache input
        if: ${{ inputs.cache != 'auto' && inputs.cache != 'registry' }}
        env:
          CACHE: ${{ inputs.cache }}
        run: |
          echo "::error::unknown cache input '${CACHE}' (expected 'auto' or 'registry')"
          exit 1

      # binfmt is only needed to emulate a foreign platform; skipping it keeps
      # the default amd64 path free of an extra Docker Hub pull.
      - name: Set up QEMU
        if: inputs.architecture != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        if: ${{ inputs.cache == 'registry' || !startsWith(inputs.runner, 'blacksmith') }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Blacksmith keeps the builder's state (layers and RUN cache mounts) on a
      # persistent disk scoped to the repository and cache-key -- storage that
      # bills per GB-month (`cache: registry` opts out of it), so there is
      # nothing to import or export and the registry cache is skipped on this
      # path: exporting it would only upload the whole cache blob on every
      # build. One key per image, because a cache only helps builds that share
      # layers and unrelated images on one key evict each other. Without this
      # step useblacksmith/build-push-action falls back to the default builder
      # and caches nothing. The default `nofallback: false` is kept on purpose:
      # if Blacksmith's builder cannot be set up, the step falls back to a
      # local uncached builder and the image still ships, rather than failing
      # the build over a cache.
      - name: Set up Blacksmith Docker builder
        if: ${{ inputs.cache != 'registry' && startsWith(inputs.runner, 'blacksmith') }}
        uses: useblacksmith/setup-docker-builder@06dd9c83a5d541274d2e3ac67625560979275267 # v2.3.0
        with:
          cache-key: ${{ inputs.image }}
          platforms: ${{ inputs.architecture }}

      # One tag set for every caller, derived from the event: the branch name
      # on a branch push (`main`, `dev`), `pr-N` on a pull request, the git tag
      # on a tag push, and always `sha-<full commit sha>` so a manifest can be
      # found by the commit that built it (a consumer that pins another repo
      # as a submodule can promote that repo's images by commit). No
      # `latest` and no date tag: nothing deploys either, and a date is not
      # unique per build while the `created` label already records it. On a
      # pull request the sha is the PR head, a commit that exists in the
      # repository, not the ephemeral refs/pull/N/merge commit. With
      # `forward_only_branch_tag` the branch tag is left out here and set by
      # "Move branch tag forward" after the push; the `version` label then
      # reads `sha-<commit>` instead of the branch name.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_PR_HEAD_SHA: true
          # With provenance on (the build-push default) the tag points at an
          # OCI index, so put the annotations there too; that is what a
          # registry browser or `crane manifest <image>:<tag>` shows.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          flavor: latest=false
          tags: |
            type=ref,event=branch,enable=${{ !inputs.forward_only_branch_tag }}
            type=ref,event=pr
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      # Two build steps, one per builder: `uses:` cannot vary by condition, and
      # the inputs are the same except for the cache. The job's `digest`
      # output takes whichever ran.
      - name: Build & Push Docker Image
        if: ${{ inputs.cache == 'registry' || !startsWith(inputs.runner, 'blacksmith') }}
        id: build_push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Build from the checked-out workspace, NOT the default Git context.
          # BuildKit does not apply the repo's .dockerignore when it clones the
          # Git context itself, so ignored files (e.g. dev fixtures) leak into
          # the build context and the published image.
          context: ${{ inputs.context }}
          push: true
          build-args: ${{ inputs.build_args }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}-buildcache:latest
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}-buildcache:latest,mode=max,oci-mediatypes=true,image-manifest=true
          file: ${{ inputs.dockerfile_path }}
          target: ${{ inputs.target }}
          platforms: ${{ inputs.architecture }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Build & Push Docker Image (Blacksmith)
        if: ${{ inputs.cache != 'registry' && startsWith(inputs.runner, 'blacksmith') }}
        id: build_push_blacksmith
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          # workspace context for the same .dockerignore reason as above
          context: ${{ inputs.context }}
          push: true
          build-args: ${{ inputs.build_args }}
          file: ${{ inputs.dockerfile_path }}
          target: ${{ inputs.target }}
          platforms: ${{ inputs.architecture }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      # The exact branch tag "Docker metadata" would have pushed (same
      # sanitising of the branch name), for the step below to move.
      - name: Branch tag
        if: ${{ inputs.forward_only_branch_tag && startsWith(github.ref, 'refs/heads/') }}
        id: branch_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          flavor: latest=false
          tags: type=ref,event=branch

      # Builds of one image for consecutive commits can run in parallel, and
      # without this step the one that finishes last owns the branch tag, even
      # when it built the older commit. Here the tag moves to this build only
      # when the commit it holds now is older, read from the
      # org.opencontainers.image.revision label every build of this workflow
      # carries and ordered by the compare API: `ahead` and `diverged` (a
      # force-push) move it, `identical` and `behind` leave it. A tag that
      # does not exist yet, an image with no revision label, or a commit the
      # repository no longer knows (404) also move it. The move re-points the
      # tag at the pushed manifest by digest, so an OCI index keeps its
      # digest and nothing is rebuilt. ghcr.io has no compare-and-set on a
      # tag, so an older build can still write between this check and the
      # write; the tag is read back once and moved again if that happened,
      # which narrows that window to seconds.
      - name: Move branch tag forward
        if: ${{ inputs.forward_only_branch_tag && startsWith(github.ref, 'refs/heads/') }}
        env:
          BRANCH_TAG: ${{ steps.branch_meta.outputs.tags }}
          DIGEST: ${{ steps.build_push.outputs.digest || steps.build_push_blacksmith.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          # Ceiling on each registry call, in seconds; ghcr.io answers in
          # well under a second, so anything near this is a hang.
          REGISTRY_TIMEOUT: 120
        run: |
          set -euo pipefail
          if [[ ! "$BRANCH_TAG" =~ ^[a-z0-9./_-]+:[A-Za-z0-9_][A-Za-z0-9._-]*$ || ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected branch tag '$BRANCH_TAG' or digest '$DIGEST'"
            exit 1
          fi
          built="${BRANCH_TAG%:*}@$DIGEST"
          err_file="$RUNNER_TEMP/branch-tag.err"
          declare -A ACTION_FOR_STATUS=([ahead]=move [diverged]=move [missing]=move [identical]=keep [behind]=skip)

          # Sets `holder` to the commit the branch tag's image was built from:
          # empty when the tag does not exist, `unlabelled` when the image has
          # no 40-hex revision label. The label sits in the image config;
          # `.Image` is that config for a single-platform image (attestation
          # manifests are left out) and a platform-keyed map of configs for a
          # multi-platform one, whose platforms share one revision.
          read_holder() {
            local config
            if ! config=$(timeout "$REGISTRY_TIMEOUT" docker buildx imagetools inspect "$BRANCH_TAG" --format '{{json .Image}}' 2> "$err_file"); then
              if grep -q ': not found$' "$err_file"; then
                holder=""
                return
              fi
              echo "::error::$BRANCH_TAG: could not read the current image: $(tr '\n' ' ' < "$err_file")"
              exit 1
            fi
            holder=$(jq -r 'if has("rootfs") then . else first(.[]) end | .config.Labels["org.opencontainers.image.revision"] // ""' <<< "$config")
            [[ "$holder" =~ ^[0-9a-f]{40}$ ]] || holder=unlabelled
          }

          # Sets `action` to move, keep or skip for the commit in `holder`.
          decide() {
            if [[ "$holder" == "$GITHUB_SHA" ]]; then
              action=keep
              return
            fi
            if [[ -z "$holder" || "$holder" == unlabelled ]]; then
              action=move
              return
            fi
            local status
            if ! status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$holder...$GITHUB_SHA?per_page=1" --jq .status 2> "$err_file"); then
              grep -q 'HTTP 404' "$err_file" || {
                echo "::error::could not compare $holder with $GITHUB_SHA: $(tr '\n' ' ' < "$err_file")"
                exit 1
              }
              status=missing
            fi
            action=${ACTION_FOR_STATUS[$status]:-}
            if [[ -z "$action" ]]; then
              echo "::error::unexpected compare status '$status' for $holder...$GITHUB_SHA"
              exit 1
            fi
          }

          for attempt in 1 2; do
            read_holder
            decide
            case "$action" in
              keep)
                [[ $attempt -eq 2 ]] || echo "$BRANCH_TAG already holds $GITHUB_SHA"
                break
                ;;
              skip)
                echo "::notice::$BRANCH_TAG left at $holder, a newer commit than $GITHUB_SHA"
                break
                ;;
              move)
                if [[ $attempt -eq 2 ]]; then
                  echo "::warning::$BRANCH_TAG was set to ${holder:-nothing} after this build moved it; moving it again"
                fi
                echo "Moving $BRANCH_TAG from ${holder:-(new tag)} to $GITHUB_SHA ($DIGEST)"
                timeout "$REGISTRY_TIMEOUT" docker buildx imagetools create --tag "$BRANCH_TAG" "$built"
                ;;
            esac
          done
