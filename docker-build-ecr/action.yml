name: docker-build-ecr
description: build and push docker image to AWS ECR
inputs:
  aws_region:
    description: The AWS region of the ECR registry
    required: true
  aws_role_arn:
    description: The ARN of the role to authenticate with
    required: true
  ecr_registry:
    description: The name of the ECR registry
    required: true
  ecr_repository:
    description: The name of the ECR repository
    required: true
  ecr_cache_repository:
    description: The name of the ECR repository to use for build caching
    required: false
  tag:
    description: The image tag
    required: true
outputs:
  digest:
    description: The image digest
    value: ${{ steps.build_and_push.outputs.digest }}
runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

    - name: Configure AWS Credentials
      id: aws_auth
      uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
      with:
        audience: sts.amazonaws.com
        aws-region: ${{ inputs.aws_region }}
        role-to-assume: ${{ inputs.aws_role_arn }}

    - name: Login to ECR
      uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
      with:
        registry: ${{ inputs.ecr_registry }}

    - name: Build and Push Docker Image
      id: build_and_push
      uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
      with:
        # Only building for AMD64 for now
        # platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ inputs.ecr_registry }}/${{ inputs.ecr_repository }}:${{ github.sha }}
          ${{ inputs.ecr_registry }}/${{ inputs.ecr_repository }}:${{ inputs.tag }}
        cache-from: ${{ inputs.ecr_cache_repository && format('type=registry,ref={0}/{1}:latest', inputs.ecr_registry, inputs.ecr_cache_repository) || '' }}
        cache-to: ${{ inputs.ecr_cache_repository && format('type=registry,ref={0}/{1}:latest,mode=max,oci-mediatypes=true,image-manifest=true', inputs.ecr_registry, inputs.ecr_cache_repository) || '' }}
