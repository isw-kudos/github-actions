repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      # Security
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.83.0
    hooks:
      - id: renovate-config-validator
        args: [--strict]
  # Workflow security audit — offline + regular persona to match CI's gate;
  # the zizmor.yml workflow runs the full online pass on the PR.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        args: [--persona, regular, --offline]
  # Workflow syntax / expression / context lint — what zizmor does not check
  # (e.g. `${{ runner.temp }}` in job-level env, which GitHub cannot parse).
  # actionlint-py ships the actionlint binary as a wheel, so no Go toolchain or
  # Docker is needed on developer machines or CI; shellcheck-py does the same
  # for the shellcheck integration. CI's actionlint.yml installs the same two
  # pins, so `run:` blocks are checked identically here and there. Renovate
  # tracks the rev (pre-commit manager) and the shellcheck-py pin (the
  # shellcheck-py custom manager in renovate.json), grouped as "actionlint".
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
        additional_dependencies: [shellcheck-py==0.11.0.1]
  - repo: local
    hooks:
      - id: wait-for-required-checks-tests
        name: wait-for-required-checks unit tests
        language: system
        entry: node .github/actions/wait-for-required-checks/index.test.cjs
        files: ^\.github/actions/wait-for-required-checks/
        pass_filenames: false
      - id: component-scope-check
        name: Check versioned component scope in commit message
        language: script
        entry: .github/scripts/check-component-scope.sh
        stages: [commit-msg]
        pass_filenames: false
